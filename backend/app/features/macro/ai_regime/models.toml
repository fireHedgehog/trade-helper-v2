# =============================================================================
# Token-budget presets (the small / medium / large selector)
# =============================================================================
# Controls how much snapshot detail is sent and how many LLM calls run.
# See docs/draft-design/10-macro-page-and-ai-regime.md §5-6.

[budget.small]
label = "Small"
snapshot_detail = "features_only"
rate_series_points = 0
personas = ["risk_on", "risk_off", "inflation", "credit_vol"]
rebuttal_round = false
persona_max_tokens = 700
reconciler_max_tokens = 1100
est_total_tokens = 11000

[budget.medium]
label = "Medium"
snapshot_detail = "features_plus_key_arrays"
rate_series_points = 30
personas = ["risk_on", "risk_off", "inflation", "credit_vol", "growth_labor", "rates_curve", "macro_catalyst"]
rebuttal_round = false
persona_max_tokens = 900
reconciler_max_tokens = 1500
est_total_tokens = 26000

[budget.large]
label = "Large"
snapshot_detail = "features_plus_arrays_plus_history"
rate_series_points = 60
personas = ["risk_on", "risk_off", "inflation", "credit_vol", "growth_labor", "rates_curve", "macro_catalyst"]
rebuttal_round = true
persona_max_tokens = 1200
reconciler_max_tokens = 2200
est_total_tokens = 54000
