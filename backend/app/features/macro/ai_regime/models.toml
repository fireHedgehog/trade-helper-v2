# =============================================================================
# AI regime — model catalogue for the Macro page dropdown
# =============================================================================
# The dropdown on the Macro page is built from this file. Each [[model]] is one
# option. `GET /api/macro/ai-regime/models?check=1` returns these rows plus a
# flag for whether your OpenAI key actually exposes each id.
#
# `GET /api/macro/ai-regime/models/account` lists every chat model id on the key.
#
# EDITING
#   - `id` must be the exact OpenAI model id.
#   - `tier`   : "economy" | "standard" | "premium"  (label / sort hint only)
#   - `family` : dropdown group label ("5.4", "5.6", "4o", …)
#   - prices are USD per 1M tokens, for the per-run cost estimate next to the
#     dropdown. 0.0 = unknown → the UI shows "cost est. n/a". Fill these in.
#   - exactly one enabled row should have `default = true`.
#   - `enabled = false` hides a row without deleting it.
# =============================================================================

# ---- 5.4 family (default) ------------------------------------------------
[[model]]
id = "gpt-5.4-nano"
label = "GPT-5.4 nano"
family = "5.4"
tier = "economy"
input_usd_per_1m = 0.0     # EDIT
output_usd_per_1m = 0.0    # EDIT
default = false
enabled = true

[[model]]
id = "gpt-5.4-mini"
label = "GPT-5.4 mini"
family = "5.4"
tier = "economy"
input_usd_per_1m = 0.0     # EDIT
output_usd_per_1m = 0.0    # EDIT
default = true             # <-- the "default 5.4" you asked for
enabled = true

[[model]]
id = "gpt-5.4"
label = "GPT-5.4"
family = "5.4"
tier = "standard"
input_usd_per_1m = 0.0     # EDIT
output_usd_per_1m = 0.0    # EDIT
default = false
enabled = true

[[model]]
